name: Update Data

on:
  schedule:
    # Run weekly on Sunday at 12:00 UTC (21:00 JST)
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import videos from YouTube
        run: python scripts/import-videos.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Update carousel images
        run: python scripts/scrape-carousel-images.py

      - name: Scrape news from official sites
        run: python scripts/scrape-news.py

      - name: Scrape schedules from official sites
        run: python scripts/scrape-schedules.py
